# One-click deploy on Render (Blueprint). One always-on instance with the built-in database on a persistent disk.
services:
  - type: web
    name: nidaan-setu
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # leave empty for the built-in database, or set a Postgres/Supabase pooler URI
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
